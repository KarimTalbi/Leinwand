[project]
name = "nodellm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=26.3.1",
    "fastapi>=0.136.1",
    "jwt>=1.4.0",
    "langchain>=1.2.15",
    "langchain-anthropic>=1.4.1",
    "langchain-google-genai>=4.2.2",
    "langchain-openai>=1.2.1",
    "langfuse>=4.5.1",
    "pwdlib>=0.3.0",
    "pydantic>=2.13.3",
    "pyjwt>=2.12.1",
    "pyright>=1.1.409",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.12",
    "sqlalchemy>=2.0.49",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14.3"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
