[project]
name = "Leinwand"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "black>=26.3.1",
    "cryptography>=47.0.0",
    "fastapi>=0.136.1",
    "greenlet>=3.5.0",
    "httpx>=0.28.1",
    "jwt>=1.4.0",
    "langchain>=1.2.15",
    "langchain-anthropic>=1.4.1",
    "langchain-core>=1.3.2",
    "langchain-google-genai>=4.2.2",
    "langchain-openai>=1.2.1",
    "langfuse>=4.5.1",
    "psycopg>=3.3.4",
    "psycopg[binary]>=3.3.4",
    "pwdlib>=0.3.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.3",
    "pyjwt>=2.12.1",
    "pyrefly>=0.60.0",
    "pyright>=1.1.409",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "ruff>=0.15.12",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.47.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
